name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

# never run two production deploys at once, and never cancel one midway
concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  deploy-production:
    name: Deploy Production Site to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build site
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          # account_id lives in wrangler.jsonc, so only the token needs to be a secret
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy

      - name: Print deployment url
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "$SITE_URL"
